<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bienvenidos al periódico Giro</title>
  <style>
    /* Reset and base styles */
    *, *::before, *::after {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: url('https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&w=1470&q=80') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header with horizontal buttons */
    header {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 0.75rem 1rem;
      display: flex;
      justify-content: flex-start;
      gap: 1rem;
      align-items: center;
      user-select: none;
      flex-wrap: wrap;
    }
    header button {
      background-color: transparent;
      border: 2px solid #fff;
      color: #fff;
      padding: 0.5rem 1rem;
      border-radius: 0.3rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s, color 0.3s;
    }
    header button:hover,
    header button:focus {
      background-color: #fff;
      color: #000;
      outline: none;
    }

    /* Main container */
    main {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem 1rem;
      background-color: rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: visible;
    }

    /* Animated main title container */
    .title-container {
      position: relative;
      font-size: 3.5rem;
      font-weight: 900;
      font-family: 'Arial Black', Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
      /* border to visualize boundaries - remove if not desired */
      /* border: 1px solid white; */
      user-select: none;
    }

    /* Animated text spans for color and border glow */
    .animated-text span {
      position: relative;
      padding: 0 0.15em;
      animation: colorCycle 6s linear infinite;
      -webkit-text-stroke: 1px transparent;
      text-stroke: 1px transparent;
    }
    /* Animate the glowing border */
    .animated-text {
      text-shadow:
        0 0 5px #ff0,
        0 0 10px #00f,
        0 0 15px #f00;
      animation: borderGlow 6s linear infinite;
      display: inline-block;
    }

    /* Color cycling keyframes for letters */
    @keyframes colorCycle {
      0% { color: #ff0; }       /* yellow */
      33% { color: #00f; }      /* blue */
      66% { color: #f00; }      /* red */
      100% { color: #ff0; }
    }

    /* Border glow cycling */
    @keyframes borderGlow {
      0%, 100% {
        text-shadow:
          0 0 8px #ff0,
          0 0 16px #ff0,
          0 0 24px #ff0;
      }
      33% {
        text-shadow:
          0 0 8px #00f,
          0 0 16px #00f,
          0 0 24px #00f;
      }
      66% {
        text-shadow:
          0 0 8px #f00,
          0 0 16px #f00,
          0 0 24px #f00;
      }
    }

    /* Three colored bouncing balls */
    .balls-container {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 180px;
      height: 40px;
      transform: translate(-50%, -50%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      user-select: none;
      z-index: 1;
    }
    .ball {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
      animation-direction: alternate;
      box-shadow: 0 0 6px rgba(255,255,255,0.7);
    }
    .ball.yellow {
      background-color: #ff0;
      animation-name: bounceYellow;
      animation-duration: 1.8s;
    }
    .ball.blue {
      background-color: #00f;
      animation-name: bounceBlue;
      animation-duration: 1.6s;
    }
    .ball.red {
      background-color: #f00;
      animation-name: bounceRed;
      animation-duration: 2s;
    }

    /* Bounce animations with horizontal movement */
    @keyframes bounceYellow {
      0% { transform: translate(0, 0); }
      50% { transform: translate(30px, -25px); }
      100% { transform: translate(0, 0); }
    }
    @keyframes bounceBlue {
      0% { transform: translate(0, 0); }
      50% { transform: translate(40px, -30px); }
      100% { transform: translate(0, 0); }
    }
    @keyframes bounceRed {
      0% { transform: translate(0, 0); }
      50% { transform: translate(50px, -20px); }
      100% { transform: translate(0, 0); }
    }

    /* Subtitles below main title */
    .subtitles {
      max-width: 600px;
      margin: 0 auto 2rem auto;
      font-size: 1.1rem;
      font-weight: 500;
      line-height: 1.4;
      text-shadow: 0 0 5px rgba(0,0,0,0.7);
    }
    .subtitles p {
      margin: 0.3rem 0;
    }

    /* Big enter button */
    .enter-button {
      background: linear-gradient(135deg, #ff0, #00f, #f00);
      background-size: 300% 300%;
      color: black;
      font-size: 1.8rem;
      font-weight: 700;
      padding: 1rem 3rem;
      border: none;
      border-radius: 0.6rem;
      cursor: pointer;
      box-shadow:
        0 0 10px #ff0,
        0 0 20px #00f,
        0 0 30px #f00;
      animation: gradientShift 5s ease infinite;
      transition: transform 0.2s ease;
      user-select: none;
    }
    .enter-button:hover,
    .enter-button:focus {
      transform: scale(1.05);
      outline: none;
    }

    @keyframes gradientShift {
      0%{background-position:0% 50%}
      50%{background-position:100% 50%}
      100%{background-position:0% 50%}
    }

    /* Footer with social icons */
    footer {
      background-color: rgba(0, 0, 0, 0.7);
      padding: 1rem 1rem;
      display: flex;
      justify-content: center;
      gap: 2rem;
      user-select: none;
    }
    footer a {
      color: #fff;
      font-size: 2rem;
      text-decoration: none;
      transition: color 0.3s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    footer a:hover,
    footer a:focus {
      color: #ff0;
      outline: none;
    }

    /* Responsive text scaling */
    @media (max-width: 600px) {
      .title-container {
        font-size: 2.5rem;
      }
      .subtitles {
        font-size: 1rem;
      }
      .enter-button {
        font-size: 1.4rem;
        padding: 0.75rem 2rem;
      }
      header {
        justify-content: center;
      }
    }
  </style>

  <script>
    // JavaScript to handle "Entrar" button click and navigate to pagina2.html with book opening animation

    // Function to create and show the book opening animation overlay
    function showBookOpenAnimation() {
      // Create overlay element
      const overlay = document.createElement('div');
      overlay.setAttribute('aria-hidden', 'true');
      overlay.style.position = 'fixed';
      overlay.style.top = '0';
      overlay.style.left = '0';
      overlay.style.width = '100vw';
      overlay.style.height = '100vh';
      overlay.style.backgroundColor = '#000';
      overlay.style.zIndex = '9999';
      overlay.style.display = 'flex';
      overlay.style.justifyContent = 'center';
      overlay.style.alignItems = 'center';
      overlay.style.overflow = 'hidden';

      // Create book animation container
      const book = document.createElement('div');
      book.style.width = '200px';
      book.style.height = '250px';
      book.style.position = 'relative';
      book.style.transformStyle = 'preserve-3d';
      book.style.animation = 'bookOpen 2s forwards ease-in-out';

      // Create front cover
      const frontCover = document.createElement('div');
      frontCover.style.position = 'absolute';
      frontCover.style.width = '100%';
      frontCover.style.height = '100%';
      frontCover.style.background = 'linear-gradient(135deg, #ff0, #00f, #f00)';
      frontCover.style.backfaceVisibility = 'hidden';
      frontCover.style.borderRadius = '8px';
      frontCover.style.boxShadow = '0 8px 20px rgba(0,0,0,0.7)';
      frontCover.style.transformOrigin = 'left center';

      // Create back cover
      const backCover = document.createElement('div');
      backCover.style.position = 'absolute';
      backCover.style.width = '100%';
      backCover.style.height = '100%';
      backCover.style.background = '#222';
      backCover.style.borderRadius = '8px';
      backCover.style.boxShadow = '0 8px 20px rgba(0,0,0,0.7)';
      backCover.style.backfaceVisibility = 'hidden';
      backCover.style.transform = 'rotateY(180deg)';
      backCover.style.transformOrigin = 'right center';

      // Append covers to book
      book.appendChild(frontCover);
      book.appendChild(backCover);

      // Append book to overlay
      overlay.appendChild(book);
      document.body.appendChild(overlay);

      // After animation ends (8s), navigate to pagina2.html
      setTimeout(() => {
        window.location.href = 'pagina2.html';
      }, 2000);
    }

    // Adding keyframes for book opening animation dynamically via JS
    const styleSheet = document.createElement('style');
    styleSheet.type = 'text/css';
    styleSheet.innerText = `
      @keyframes bookOpen {
        0% {
          transform: perspective(800px) rotateY(0deg);
        }
        100% {
          transform: perspective(800px) rotateY(-160deg);
          opacity: 0;
        }
      }
    `;
    document.head.appendChild(styleSheet);

    // Event listener on enter button
    document.getElementById('enterBtn').addEventListener('click', (event) => {
      event.preventDefault();
      showBookOpenAnimation();
    });
  </script>
